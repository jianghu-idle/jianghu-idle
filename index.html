<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070907" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>江湖·挂机录</title>
<style>
  :root {
    --bg: #070907;
    --panel: #0d110d;
    --line: #1e2a1e;
    --dim: #5f7a5f;
    --text: #cfe0cf;
    --green: #7fd08a;
    --gold: #d8b56a;
    --red: #d06a6a;
    --blue: #7aa8e0;
    --purple: #b48ae0;
    --orange: #e0a060;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(900px 500px at 50% -10%, #0f150f 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Cascadia Mono", "Sarasa Mono SC", "Microsoft YaHei", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: var(--text);
    background: #121812;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3a5a3a; color: #e6f5e6; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { border-color: #3f6b46; color: var(--green); }
  button.danger { border-color: #5a2c2c; color: var(--red); }
  #app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 100%;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .brand { color: var(--green); font-size: 16px; letter-spacing: .12em; }
  .brand .ver { color: var(--dim); font-size: 11px; letter-spacing: 0; }
  .hud { display: flex; gap: 16px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  .hud b { color: var(--text); font-weight: 500; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 12px;
    align-items: start;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .log-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .log-head {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 8px 12px; color: var(--dim); font-size: 12px;
    border-bottom: 1px solid var(--line);
  }
  .log-head b { color: var(--green); font-weight: 500; }
  .log-modes { display: flex; gap: 4px; margin-left: auto; }
  .log-modes button { padding: 2px 8px; font-size: 11px; }
  .log-modes button.on { color: var(--green); border-color: #3f6b46; }
  #log {
    height: 46vh; min-height: 300px;
    overflow-y: auto;
    padding: 10px 12px;
    font-size: 12.5px;
    scroll-behavior: smooth;
  }
  #log .line { margin: 1px 0; }
  #log .sys { color: var(--dim); }
  #log .good { color: var(--green); }
  #log .bad { color: var(--red); }
  #log .gold { color: var(--gold); }
  #log .story { color: #9fb8a8; font-style: italic; }
  #log .boss { color: var(--orange); }
  #log .righteous { color: #7cc4ff; text-shadow: 0 0 6px rgba(124,196,255,.25); }
  #log .evil { color: #c98bff; text-shadow: 0 0 6px rgba(201,139,255,.28); }
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 8px 12px; }
  .bar {
    position: relative; height: 16px; background: #0a0f0a;
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  }
  .bar i { display: block; height: 100%; width: 0; transition: width .25s; }
  .bar.hp i { background: linear-gradient(90deg, #2c5a34, #6bbf78); }
  .bar.mp i { background: linear-gradient(90deg, #1f3a5a, #5a8fd0); }
  .bar.exp i { background: linear-gradient(90deg, #4a3a1a, #c8a25a); }
  .bar b {
    position: absolute; inset: 0; text-align: center; font-size: 11px;
    color: #dfe9df; font-weight: 400; line-height: 16px; text-shadow: 0 0 3px #000;
  }
  .party-status { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 12px 8px; font-size: 11px; color: #9fb59f; }
  .party-status .dead { color: #d06a6a; text-decoration: line-through; }
  .actions { display: flex; gap: 8px; padding: 0 12px 12px; flex-wrap: wrap; }
  aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  nav#tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  nav#tabs button { padding: 5px 10px; font-size: 12px; }
  nav#tabs button.on { color: var(--green); border-color: #3f6b46; background: #101810; }
  #panel { min-height: 320px; padding: 12px; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; color: var(--green); font-weight: 500; }
  #panel h4 { margin: 12px 0 6px; font-size: 12px; color: var(--dim); font-weight: 400; }
  .kv { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 12.5px; }
  .kv span:first-child { color: var(--dim); }
  .kv b { font-weight: 500; }
  .item {
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
    margin-bottom: 6px; background: #0a0e0a;
  }
  .item .name { font-size: 12.5px; }
  .item .aff { color: var(--dim); font-size: 11.5px; }
  .item .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item button { padding: 2px 8px; font-size: 11px; }
  .q-white { color: #cfcfcf; }
  .q-green { color: #7fd08a; }
  .q-blue { color: #7aa8e0; }
  .q-purple { color: #b48ae0; }
  .q-orange { color: #e0a060; }
  .q-red { color: #ff5c5c; text-shadow: 0 0 6px rgba(255,92,92,.35); }
  .muted { color: var(--dim); }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal.hidden { display: none; }
  .modal-card {
    width: min(680px, 100%); max-height: 84vh; overflow-y: auto;
    background: #0b100b; border: 1px solid #2c3f2c; border-radius: 8px; padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal-card h2 { margin: 0 0 10px; color: var(--green); font-size: 15px; font-weight: 500; letter-spacing: .08em; }
  .modal-card p { margin: 6px 0; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .map-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid #141c14; }
  .map-row.locked { opacity: .45; }
  .map-row.cur { border-left: 2px solid var(--green); }
  .story-text { color: #a9c4b0; font-style: italic; margin: 8px 0; }
  .npc-card { display: flex; gap: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .npc-pic {
    width: 64px; height: 64px; flex: 0 0 64px; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--dim);
    font-size: 11px; overflow: hidden; background: #080c08;
  }
  .npc-pic img { width: 100%; height: 100%; object-fit: cover; }
  .npc-main { min-width: 0; flex: 1; }
  .npc-name { color: var(--green); }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; font-size: 11px; color: var(--dim); margin-left: 6px; }
  input[type="file"] { color: var(--dim); font-size: 11px; }
  .choice { display: block; width: 100%; text-align: left; margin: 6px 0; }
  @media (max-width: 900px) {
    #app { padding: 10px 10px 22px; }
    main { grid-template-columns: 1fr; }
    #log { height: 38vh; min-height: 220px; }
    .hud { gap: 10px; font-size: 11.5px; }
    nav#tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    nav#tabs button { flex: 0 0 auto; padding: 8px 12px; }
    button { min-height: 34px; touch-action: manipulation; }
    .item .row { flex-wrap: wrap; }
    .item button { min-height: 30px; }
    .modal { padding: 10px; }
    .modal-card { padding: 14px; max-height: 90vh; }
  }
  @media (max-width: 520px) {
    body { font-size: 12.5px; }
    header { flex-direction: column; align-items: flex-start; }
    .bars { grid-template-columns: 1fr; }
    .actions button { flex: 1 1 40%; }
    #panel { padding: 10px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">江 湖 · 挂 机 录 <span class="ver">v1.3</span></div>
    <div class="hud">
      <span>侠客 <b id="hud-name">—</b></span>
      <span>境界 <b id="hud-level">1</b></span>
      <span>所在 <b id="hud-map">青石村</b></span>
      <span>银两 <b id="hud-silver">0</b></span>
      <span>侠义 <b id="hud-honor">0</b></span>
      <span>玄晶 <b id="hud-xuanjing">0</b></span>
    </div>
  </header>

  <main>
    <section class="card log-wrap">
      <div class="log-head">
        <span>江湖见闻</span>
        <span class="log-modes">
          <button data-logmode="all" class="on">全部</button>
          <button data-logmode="brief">精简</button>
        </span>
        <b id="battle-status">行走江湖中…</b>
      </div>
      <div id="log"></div>
      <div class="bars">
        <div class="bar hp"><i id="bar-hp"></i><b id="txt-hp"></b></div>
        <div class="bar mp"><i id="bar-mp"></i><b id="txt-mp"></b></div>
        <div class="bar exp"><i id="bar-exp"></i><b id="txt-exp"></b></div>
      </div>
      <div id="party-status" class="party-status"></div>
      <div class="actions">
        <button id="btn-fight" class="primary">暂停挂机</button>
        <button id="btn-potion">喝药</button>
        <button id="btn-map">切换地图</button>
        <button id="btn-npc">故人</button>
      </div>
    </section>

    <aside>
      <nav id="tabs"></nav>
      <div id="panel" class="card"></div>
    </aside>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" id="modal-body"></div></div>

<script>
(function(){
  function show(msg){
    var d=document.createElement('div');
    d.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:9999;background:#2a0d0d;border:1px solid #a33;color:#ffb3b3;padding:10px 12px;font:12px/1.5 monospace;white-space:pre-wrap;border-radius:6px';
    d.textContent='脚本出错（把这段发给开发者）：\n'+msg;
    document.body.appendChild(d);
  }
  window.addEventListener('error', function(e){
    show((e.message||'未知错误')+'\n'+(e.filename||'')+':'+(e.lineno||'')+':'+(e.colno||''));
  });
  window.addEventListener('unhandledrejection', function(e){
    show('Promise: '+((e.reason&&e.reason.message)||e.reason));
  });
})();
</script>
<script>
if (location.protocol === 'http:' || location.protocol === 'https:') {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
